[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assetlens-api"
version = "0.1.0"
description = "AssetLens portfolio analytics API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.6,<6",
  "fastapi>=0.128.5,<1",
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  "opentelemetry-api>=1.35,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
  "opentelemetry-instrumentation-fastapi>=0.56b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.56b0,<1",
  "opentelemetry-sdk>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --cov=app --cov-report=term-missing"
cache_dir = ".tmp/pytest-cache"
# Reject the deprecated TestClient fallback rather than hiding its warning.
filterwarnings = ["error:Using `httpx` with `starlette.testclient` is deprecated:Warning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
