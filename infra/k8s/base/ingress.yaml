apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assetlens
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: assetlens.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assetlens-web
                port:
                  number: 3000
