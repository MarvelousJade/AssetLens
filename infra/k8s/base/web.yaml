apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetlens-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assetlens-web
  template:
    metadata:
      labels:
        app: assetlens-web
    spec:
      containers:
        - name: web
          image: assetlens-web
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: assetlens-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 8
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assetlens-web
spec:
  selector:
    app: assetlens-web
  ports:
    - port: 3000
      targetPort: 3000
