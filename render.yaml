services:
  - type: web
    name: assetlens-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: apps/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TASK_MODE
        value: local
      - key: WEB_ORIGIN
        value: https://assetlens-web.onrender.com
      - key: DEMO_TOKEN
        value: assetlens-demo-token
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: assetlens-web
    runtime: docker
    plan: free
    region: ohio
    rootDir: apps/web
    envVars:
      - key: API_UPSTREAM
        value: https://assetlens-api.onrender.com
